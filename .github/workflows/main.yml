name: Wiki Builder

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:        
      - uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0 # 拉取完整历史
      - uses: Saber2pr/wiki-builder@v0.0.96
        with:
          expandAllMenu: on
          title: 科技爱好者周刊，每周五发布
          keywords: ai,tech,news
          description: 科技爱好者周刊，每周五发布
